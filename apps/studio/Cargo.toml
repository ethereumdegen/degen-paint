[package]
name = "dpaint-studio-app"
# The desktop shell ships as a signed bundle, not as a crates.io package.
publish = false
description = "degen-paint Studio: the desktop shell around the shared engine API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "dpaint_studio_app"
path = "src/lib.rs"

[[bin]]
name = "degen-paint"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dpaint-core.workspace = true
dpaint-studio = { workspace = true, features = ["ai"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
parking_lot = "0.12"
# `devtools` keeps the inspector available in release too: this is a tool for building
# the UI it ships, and a webview you cannot inspect is a webview you cannot debug.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"

# Only for `g_set_prgname`, which is what a GTK 3 window's Wayland `app_id` comes from.
# Same version GTK itself pulls in, so no second glib enters the tree.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

[dev-dependencies]
tempfile = "3"
