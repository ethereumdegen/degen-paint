[package]
name = "dpaint-core"
description = "Document model, op registry, journal and asset store for degen-paint"
keywords = ["graphics", "image", "vector", "gltf", "agent"]
categories = ["graphics", "multimedia::images"]
documentation = "https://docs.rs/dpaint-core"
readme.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
json-patch.workspace = true
indexmap.workspace = true
thiserror.workspace = true
blake3.workspace = true
chrono.workspace = true
ulid.workspace = true
kurbo.workspace = true

[dev-dependencies]
tempfile = "3"

[target.wasm32-unknown-unknown.dependencies]
# `crypto.getRandomValues` for ulid and id generation…
getrandom = { version = "0.3", features = ["wasm_js"] }
# …and `Date` for `now_iso`: without `wasmbind`, chrono falls through to `SystemTime`,
# which is not implemented on `wasm32-unknown-unknown` and panics on the first op.
chrono = { workspace = true, features = ["wasmbind"] }
