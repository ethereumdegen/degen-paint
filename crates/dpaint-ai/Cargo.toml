[package]
name = "dpaint-ai"
description = "Optional fal.ai and QuiverAI generation ops for degen-paint"
keywords = ["ai", "image-generation", "svg", "fal", "vectorize"]
categories = ["graphics", "api-bindings"]
documentation = "https://docs.rs/dpaint-ai"
readme.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["net", "keychain"]
# Real HTTP via reqwest's blocking client. Without it the crate still builds and every
# non-network op works; network ops report `provider_error`.
net = ["dep:reqwest"]
# OS keychain lookup for provider keys.
keychain = ["dep:keyring"]

[dependencies]
dpaint-core.workspace = true
dpaint-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
tiny-skia.workspace = true
image.workspace = true
toml = "0.8"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["blocking"], optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }

[dev-dependencies]
tempfile = "3"
