[package]
name = "dpaint-model3d"
description = "glTF authoring for degen-paint: extrude, revolve, PBR materials, validation"
keywords = ["gltf", "3d", "mesh", "extrude", "pbr"]
categories = ["graphics", "rendering::data-formats"]
documentation = "https://docs.rs/dpaint-model3d"
readme.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dpaint-core.workspace = true
dpaint-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
kurbo.workspace = true
gltf-json = { workspace = true, features = [
    "names",
    "KHR_lights_punctual",
    "KHR_materials_emissive_strength",
] }
base64.workspace = true
lyon_tessellation = "1"
mikktspace = "0.3"
gltf = { version = "1", default-features = false, features = [
    "import",
    "utils",
    "names",
    "KHR_lights_punctual",
    "KHR_materials_emissive_strength",
] }

[dev-dependencies]
tempfile = "3"
dpaint-core.workspace = true
dpaint-vector.workspace = true
serde_json.workspace = true
gltf = { version = "1", default-features = false, features = [
    "import",
    "utils",
    "names",
    "KHR_lights_punctual",
    "KHR_materials_emissive_strength",
] }
