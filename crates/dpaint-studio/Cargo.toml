[package]
name = "dpaint-studio"
description = "Shared API and local server behind the degen-paint GUI shells"
keywords = ["gui", "editor", "graphics", "studio", "agent"]
categories = ["graphics", "gui"]
documentation = "https://docs.rs/dpaint-studio"
readme.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The generation providers' own prices and key storage, behind `quote`, `providers.*` and
# Settings › Providers. Off by default: the editor is complete without them, and the wasm
# build has no business linking an HTTP client.
ai = ["dep:dpaint-ai"]
# Import from a URL as well as a path. An operator with no file system —
# Starkbot under P3 — otherwise cannot bring a reference in at all, and
# "make it like the one on the site" is a brief it can only guess at.
net = ["dep:reqwest"]

[dependencies]
dpaint-core.workspace = true
dpaint-raster.workspace = true
dpaint-vector.workspace = true
dpaint-model3d.workspace = true
dpaint-render.workspace = true
dpaint-inspect.workspace = true
image.workspace = true
schemars.workspace = true
tiny-skia.workspace = true
dpaint-ai = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
