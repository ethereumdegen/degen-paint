[package]
name = "dpaint-render"
description = "Unified render targets, link resolution and encoders for degen-paint documents"
keywords = ["render", "png", "svg", "gltf", "graphics"]
categories = ["graphics", "rendering"]
documentation = "https://docs.rs/dpaint-render"
readme.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dpaint-core.workspace = true
dpaint-raster = { path = "../dpaint-raster", version = "0.1.0", default-features = false }
dpaint-vector.workspace = true
dpaint-model3d.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
image.workspace = true
tiny-skia.workspace = true
kurbo.workspace = true

[features]
default = ["parallel"]
# Forwarded so a wasm consumer can turn rayon off through the whole stack.
parallel = ["dpaint-raster/parallel"]

[dev-dependencies]
tempfile = "3"
